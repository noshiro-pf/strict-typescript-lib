packages:
  - 'packages/scripts-common'
  - 'packages/v*'
  - 'packages/v*/output'
  - 'packages/v*/output-branded'

update:
  githubActions: true
  ignoreDeps:
    - typescript

minimumReleaseAge: 10080 # = 7 days

minimumReleaseAgeExclude:
  - '@types/**'
  - ts-type-forge
  - eslint-plugin-ts-type-forge
  - ts-data-forge
  - eslint-plugin-ts-data-forge
  - ts-fortress
  - eslint-plugin-ts-fortress
  - ts-repo-utils
  - ts-codemod-lib
  - synstate
  - 'synstate-*'
  - eslint-config-typed
  - octokit-safe-types
  - github-settings-as-code
  - 'strict-ts-lib-*'

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Both patches work around the same thing, and neither changes what any type
# means.
#
# The lib this repository publishes narrows two of the stock conditional
# helpers: `Exclude<T, U extends T>` and `Omit<T, K extends keyof T>`, where
# the stock lib leaves the second parameter unconstrained. A package that
# subtracts a literal key union from a still-generic `keyof T` is therefore
# accepted by the stock lib and rejected here with TS2344 — TypeScript cannot
# prove the union is a subset of a `keyof T` it has not resolved yet. Wrapping
# the subtrahend in `Extract<keyof T, …>` denotes exactly the same set (the
# stock helpers ignore keys that are not in `T` anyway) and does satisfy the
# constraint.
#
# - ts-type-forge@9.1.1: `LengthConstraintKeysOf` and `ExtraKeysOf`, which
#   broke every `packages/v*/output*` type-check.
# - @eslint/plugin-kit@0.7.2: `CustomRuleDefinitionType`, reached from
#   `eslint.config.mts` via a non-declaration `types.cts` that `skipLibCheck`
#   does not skip. It broke `check:root`. Arrived with the eslint 9 -> 10 bump
#   (plugin-kit 0.4.1 -> 0.7.2).
#
# Drop each once the fix is released upstream.
patchedDependencies:
  '@eslint/plugin-kit@0.7.2': patches/@eslint__plugin-kit@0.7.2.patch
  ts-type-forge@9.1.1: patches/ts-type-forge@9.1.1.patch
