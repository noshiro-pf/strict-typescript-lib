name: Weekly pnpm update

# Runs `pnpm update --latest -r` (whose skip rules — `update.ignoreDeps`,
# `minimumReleaseAge` — live in pnpm-workspace.yaml) together with `pnpm
# self-update`, and opens a single bundled pull request that auto-merges once
# CI passes. This replaces Dependabot entirely; there is no
# .github/dependabot.yml.
#
# The action pins move in a second, separate step. `update.githubActions` is
# deliberately `false`, so the `--latest` run above leaves the workflow files
# alone, and `update-actions` turns the check back on per-invocation with
# `--include-github-actions`. That second command has no `--latest`, so an
# action only moves within `^current`: a major stays put until a human takes it.
# `changesets/action` v2 is why. It requires Changesets CLI v3 and renamed every
# input, so the major arriving in #107 broke release.yml on main, and neither
# `minimumReleaseAge` nor `ignoreDeps` applies to actions (pnpm reads their
# versions from `git ls-remote` refs, which carry no publication date).
#
# Authenticates with a GitHub App installation token (the same App used by
# sync-agent-config.yml) so that the push triggers the push-based CI workflows
# and the repository owner (a ruleset bypass actor) can auto-merge.

# ## One branch, reused
#
# The branch is `chore/pnpm-update` with no date in it, and every run rebuilds
# it from a fresh checkout of main and force-pushes. A week that lands no fix
# therefore does not leave a stale pull request behind for the next one to sit
# beside — there is only ever one open, and it is always rebased onto main.
#
# Reusing the name is what makes the two details below matter; with a new dated
# branch each week neither could bite, because the branch never already existed.

on:
  schedule:
    # Weekly, Saturday 06:07 JST (Friday 21:07 UTC) — lands before the weekend.
    - cron: '7 21 * * 5'

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pnpm-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist any token in the git config: `pnpm install` below runs
          # dependency lifecycle scripts, and the PAT must not be exposed to them.
          # It is supplied inline only for the final push.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Update pnpm itself
        run: pnpm self-update

      - name: Update dependencies
        run: |
          pnpm update --latest -r
          pnpm run update-actions
          pnpm install --no-frozen-lockfile

      # 依存更新が終わってからトークンを発行する。許可済みビルドスクリプトが
      # 動く前に鍵を job へ持ち込まないため。
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          permission-contents: write # ブランチの push
          permission-pull-requests: write # PR の作成と auto-merge の有効化
          # `update-actions` により .github/workflows/ の action ピンも
          # 更新されるため、これが無いと push が
          # 「refusing to allow a GitHub App to create or update workflow ...」で拒否される。
          permission-workflows: write # workflow ファイルを含むコミットの push

      - name: Open auto-merge PR if anything changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # `git status --porcelain` (not `git diff --quiet`) so untracked files
          # created by the update are detected too.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Dependencies already up to date; nothing to do."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A fixed branch name, not one carrying the date: every run starts from
          # a fresh checkout of main, so force-pushing here both refreshes the
          # open pull request and rebases it, instead of leaving last week's
          # behind and opening another one.
          branch="chore/pnpm-update"
          git switch -c "$branch"
          git add -A
          git commit -m "chore: update dependencies"

          # Authenticate the push inline so the PAT is never written to git config.
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # `--force-with-lease` with no value compares against the
          # remote-tracking ref, and `actions/checkout` configures a fetch
          # refspec for the default branch alone — so this branch has none, and
          # the push is rejected with "stale info" every run after the one that
          # creates it. Naming the expected value restores the protection: an
          # empty value means "expect it not to exist", which is what the first
          # run wants.
          # Two steps rather than a pipeline, so that a failed `ls-remote` stops
          # the job instead of yielding an empty lease and force-pushing anyway
          # — a pipeline would report `cut`'s exit status, which is always 0.
          remote_ref="$(git ls-remote "$remote_url" "refs/heads/${branch}")"
          expected="$(printf '%s' "$remote_ref" | cut -f1)"

          git push --force-with-lease="refs/heads/${branch}:${expected}" \
            "$remote_url" \
            "HEAD:refs/heads/${branch}"

          # By branch name alone `gh pr view` also finds a merged pull request,
          # and the branch is recreated every run — so once the first one
          # merges, this would skip creating the next and then fail trying to
          # auto-merge a closed pull request. Ask for an open one.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != 'OPEN' ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update dependencies" \
              --body "Automated weekly dependency update via \`pnpm update --latest -r\` + \`pnpm run update-actions\` + \`pnpm self-update\`. Action pins move within \`^current\` only, so a major waits for a human. Rebuilt from main on every run, so force-pushes to this branch are expected. Auto-merges once CI passes."
          fi
          gh pr merge --auto --squash "$branch"
