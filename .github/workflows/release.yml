name: Release

on:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  release:
    name: Release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write # to create release
      issues: write # to post issue comments
      pull-requests: write # to create pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REPO_AUTOMATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.REPO_AUTOMATION_BOT_PRIVATE_KEY }}
          # App が持つ全権限をそのまま受け取らないよう、release に必要な範囲へ明示的に絞る。
          permission-contents: write # version ブランチの push / タグ / GitHub Release の作成
          permission-pull-requests: write # version PR の作成と更新

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: pnpm run release:publish
          version-script: pnpm run changeset:version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # このリポジトリの成果物は npm ではなく、`dist:github-release` が
          # `gh release create dist-vX.Y-<version>` で作る tarball の
          # GitHub Release。タグと Release はそちらが唯一の作成者なので、
          # action 側には作らせない。
          #
          # なお changesets/action v2 は publish script の stdout を読むのをやめ、script が
          # `$CHANGESETS_OUTPUT` に NDJSON を書くことを期待する。こちらは
          # 書かないので、publish 実行時に「GitHub releases and git tags
          # cannot be created without this output」という warning が毎回出る。
          # これは想定どおりで、`published` 出力もこのワークフローでは使って
          # いない。
          create-github-releases: false
          push-git-tags: false
        env:
          # Used by the `gh` CLI in `dist:github-release` to create/upload the
          # tarball GitHub Release.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
